name: theater-death-frontend-acceptance
services:
  api:
    extends:
      file: compose.v2.yml
      service: test
    profiles: [acceptance]
    command: [node, tests/frontend-v2-acceptance-server.ts]
    environment:
      NODE_ENV: test
      PORT: 3000
      DATA_DIR: /app/data-frontend-v2
      CLOCK_SOCKET: /clock-control/clock.sock
      ACCOUNT_COOKIE_NAME: td_account_frontend_acceptance
    volumes:
      - frontend-acceptance-data:/app/data-frontend-v2
      - frontend-acceptance-clock:/clock-control
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:3000/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    extends:
      file: compose.v2.yml
      service: test
    profiles: [acceptance]
    command: [npm, run, 'dev:web:v2']
    environment:
      NODE_ENV: development
      API_PROXY_TARGET: http://api:3000
    volumes:
      - ../web-v2:/app/web-v2:ro
      - ../vite.v2.config.ts:/app/vite.v2.config.ts:ro
    depends_on:
      api:
        condition: service_healthy
  seed:
    extends:
      file: compose.frontend.yml
      service: seed
    profiles: [acceptance]
    volumes:
      - frontend-acceptance-data:/app/data-frontend-v2
      - frontend-acceptance-access:/test-access
  browser:
    image: theater-death-frontend-e2e:pw1630-ts
    profiles: [acceptance]
    network_mode: service:web
    command: [npx, playwright, test, --config=playwright.v2.config.ts]
    volumes:
      - ../e2e/specs-v2:/e2e/specs-v2:ro
      - ../e2e/helpers-v2:/e2e/helpers-v2:ro
      - ../e2e/playwright.v2.config.ts:/e2e/playwright.v2.config.ts:ro
      - ../e2e/tsconfig.v2.json:/e2e/tsconfig.v2.json:ro
      - ../tests/fixtures/contract-2.1:/contract-fixtures:ro
      - ../contracts:/contracts:ro
      - ../rulesets:/rulesets:ro
      - ../test-results-frontend-v2:/results
      - frontend-acceptance-access:/test-access:ro
      - frontend-acceptance-clock:/clock-control:ro
    depends_on:
      web:
        condition: service_started
volumes:
  frontend-acceptance-data:
  frontend-acceptance-access:
  frontend-acceptance-clock:
