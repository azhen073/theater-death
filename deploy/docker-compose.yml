name: theater-death

services:
  app:
    image: ghcr.io/azhen073/theater-death:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      VOICE_ENABLED: ${VOICE_ENABLED:-false}
      AGORA_APP_ID: ${AGORA_APP_ID:-}
      AGORA_APP_CERTIFICATE: ${AGORA_APP_CERTIFICATE:-}
      AGORA_CUSTOMER_KEY: ${AGORA_CUSTOMER_KEY:-}
      AGORA_CUSTOMER_SECRET: ${AGORA_CUSTOMER_SECRET:-}
    volumes:
      - ../data:/app/data

  e2e:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.e2e
    profiles: ["e2e"]
    # 与 app 共享网络命名空间：浏览器经 http://localhost:3000 访问（localhost 天然是安全上下文，
    # 免去非 localhost 的 HTTP 被 Chromium 强制升级 HTTPS 的问题）。
    network_mode: service:app
    depends_on:
      app:
        condition: service_started
    environment:
      E2E_BASE_URL: http://localhost:3000
      E2E_AGORA_APP_ID: ${AGORA_APP_ID:-}
      E2E_AGORA_APP_CERTIFICATE: ${AGORA_APP_CERTIFICATE:-}
      E2E_AGORA_CUSTOMER_KEY: ${AGORA_CUSTOMER_KEY:-}
      E2E_AGORA_CUSTOMER_SECRET: ${AGORA_CUSTOMER_SECRET:-}
      E2E_AGORA_REST_BASE_URL: ${AGORA_REST_BASE_URL:-https://api.sd-rtn.com}
    volumes:
      - ../e2e-results:/e2e/results
