# LiveKit 公网自托管配置（服务器有公网入站时使用）
#
# 用法（服务器 .env）：
#   VOICE_ENABLED=true
#   COMPOSE_PROFILES=voice
#   LIVEKIT_NODE_IP=            （留空：由 STUN 自动发现当前公网 IP，适配动态 IP）
#   LIVEKIT_CONFIG_FILE=livekit-public.yaml
#
# 前置条件（缺一不可）：
#   1. 路由器/光猫把 UDP 7882、TCP 7881 映射到运行本服务的机器；
#   2. 反代 / Cloudflare Tunnel 把 wss 域名（如 livekit.example.com）指向本服务 7880；
#   3. .env 的 VOICE_SERVICE_URL=wss://<该媒体域名>。
#
# 说明：公网 IP 变化后重启本容器即可重新发现，无需改配置；IP 变化期间进行中的对局可能媒体中断。

port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true

logging:
  level: info
