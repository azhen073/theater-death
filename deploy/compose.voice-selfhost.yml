services:
  app:
    environment:
      VOICE_ENABLED: 'true'
      VOICE_SERVICE_URL: ${VOICE_SERVICE_URL:?Set the public wss LiveKit URL}
      VOICE_ADMIN_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set a unique LiveKit API key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set a LiveKit secret of at least 32 characters}
    depends_on:
      livekit:
        condition: service_started

  livekit:
    image: livekit/livekit-server:v1.9.7
    restart: unless-stopped
    entrypoint: [/bin/sh, -c]
    command:
      - 'exec /livekit-server --config /etc/livekit.yaml $${LIVEKIT_NODE_IP:+--node-ip $${LIVEKIT_NODE_IP}}'
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-}
    volumes:
      - ./livekit.generated.yaml:/etc/livekit.yaml:ro
    ports:
      - '127.0.0.1:7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
