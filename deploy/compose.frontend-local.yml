name: theater-death-frontend-local
services:
  app:
    image: theater-death-frontend-v2:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend-v2
      args:
        VCS_REF: ${FRONTEND_VCS_REF:-unrecorded}
    ports: ['127.0.0.1:5174:3000']
    environment:
      # Local HTTP API; the bundled frontend is always built in production mode.
      # Public HTTPS deployment must set NODE_ENV=production and its exact origin.
      NODE_ENV: development
      PUBLIC_BASE_URL: http://localhost:5174
      ACCOUNT_COOKIE_NAME: td_account_frontend_local
      ADMIN_COOKIE_NAME: td_admin_frontend_local
      DATA_DIR: /data
      VOICE_ENABLED: ${VOICE_ENABLED:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - frontend-local-data:/data
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:3000/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  frontend-local-data:
